[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openscout"
version = "0.1.0"
description = "A pluggable sports analytics library and CLI for basketball, soccer, and beyond."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aadi Arya", email = "aadi.arya48@gmail.com" },
]
keywords = ["sports-analytics", "basketball", "soccer", "plugins", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "mypy>=1.8",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/AadiCodes4/openscout"
Repository = "https://github.com/AadiCodes4/openscout"
Issues = "https://github.com/AadiCodes4/openscout/issues"
Changelog = "https://github.com/AadiCodes4/openscout/blob/main/CHANGELOG.md"

[project.scripts]
openscout = "openscout.cli:main"

# This is the heart of the plugin architecture: openscout's own basketball
# and soccer support is registered through the exact same entry_points
# mechanism that a third-party package would use to add a new sport.
# See CONTRIBUTING.md for a walkthrough of adding your own plugin.
[project.entry-points."openscout.sports"]
basketball = "openscout.sports.basketball:BasketballSport"
soccer = "openscout.sports.soccer:SoccerSport"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openscout = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["openscout"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
